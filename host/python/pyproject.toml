[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tessera-deck"
version = "0.1.0"
description = "Host library and command-line tool for the Tessera Deck open-hardware macro deck"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["pyserial>=3.5", "Pillow>=10.1"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
tessera = "tessera.cli:main"

[tool.setuptools]
packages = ["tessera"]

[tool.pytest.ini_options]
testpaths = ["tests"]
